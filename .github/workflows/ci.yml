name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the hub CLI
        run: pip install -e "./sushihub/cli[test]"
      - name: Test
        run: python -m pytest sushihub/cli/tests -q
      - name: Test the argv recorder
        # tools/record_cli_argv.py is this repository's evidence mechanism for a
        # CLI change, so its own tests run here rather than nowhere.
        run: python -m pytest tools/tests -q

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushistack-cli"
version = "0.1.0"
description = "SushiStack CLI — shared dependency provisioning and module manager for the stack"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "keyring>=24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "jsonschema>=4.0"]

# sushicore (the shared CLI presentation layer, in this repository at `sushicore/`)
# is intentionally NOT listed above: it isn't published to any index, so a bare
# "sushicore>=0.1.0" dependency can't be resolved by pip/pipx from a clean
# environment. `pip install -e cli` expects it already installed once in the
# same environment (`pip install -e ./sushicore`); `python cli/install.py`
# (pipx, isolated venv) injects it automatically from that directory.

[project.scripts]
hub = "sushistack.cli:app"
sushihub = "sushistack.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushistack*"]

# The dependency fragments under cli/manifests/ are read from the cloned
# workspace at run time (hub resolves the workspace root via the .sushistack
# marker), so they are not shipped inside the wheel.

[tool.setuptools.package-data]
sushistack = ["py.typed"]
